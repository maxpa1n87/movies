{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Create New Movie{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form enctype="multipart/form-data" method="post">
    <fieldset>
      <label for="title">
        Title
        <input name="title" id="title" placeholder="Title" autocomplete="title" value="{{ request.form['title'] }}" required
        {% for message in get_flashed_messages() %}
          {% if 'movie_title_is_invalid' in message %}
            aria-invalid="true"
            aria-describedby="invalid-helper"
          {% endif %}
        {% endfor %}
        ></input>
        {% for message in get_flashed_messages() %}
          {% if 'movie_title_is_invalid' in message %}
            <small id="invalid-helper">
              {{ message['movie_title_is_invalid'] }}
            </small>
          {% endif %}
        {% endfor %}
      </label>
      <label for="subtitle">
        Subtitle
        <input name="subtitle" id="subtitle" placeholder="Subtitle" autocomplete="subtitle" value="{{ request.form['subtitle'] }}"></input>
      </label>
      <label for="description">
        Description
        <textarea name="description" id="description" placeholder="Description" autocomplete="description">{{ request.form['description'] }}</textarea>
      </label>
      <label for="author">
        Author
        <input name="author" id="author" placeholder="Author" autocomplete="author" value="{{ request.form['author'] }}"></input>
      </label>
      <label for="release">
        Release
        <input name="release" id="release" placeholder="Release" autocomplete="release" type="date" aria-label="Release" value="{{ request.form['release'] }}"
        {% for message in get_flashed_messages() %}
          {% if 'movie_date_time_invalid' in message %}
            aria-invalid="true"
            aria-describedby="invalid-helper"
          {% endif %}
        {% endfor %}
        ></input>
        {% for message in get_flashed_messages() %}
          {% if 'movie_date_time_invalid' in message %}
            <small id="invalid-helper">
              {{ message['movie_date_time_invalid'] }}
            </small>
          {% endif %}
        {% endfor %}
      </label>
      <label for="image">
        Image
        <input name="image" id="image" type="file" accept="image/*" aria-describedby="image-helper"></input>
        <small id="image-helper">
          Maximum filesize is {{ config['MAX_CONTENT_LENGTH'] / 1000 / 1000 }}MB
        </small>
      </label>
    </fieldset>
    <input type="submit" value="Save"></input>
  </form>
{% endblock %}
