{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}New Movie{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="title">Title</label>
    <input name="title" id="title" value="{{ request.form['title'] }}" required></input>
    <label for="subtitle">Subtitle</label>
    <input name="subtitle" id="subtitle" value="{{ request.form['subtitle'] }}"></input>
    <label for="description">Description</label>
    <textarea name="description" id="description">{{ request.form['description'] }}</textarea>
    <label for="author">Author</label>
    <input name="author" id="author" value="{{ request.form['author'] }}"></input>
    <label for="release">Release</label>
    <input name="release" id="release" value="{{ request.form['release'] }}"></input>
    <input type="submit" value="Save">
  </form>
{% endblock %}
