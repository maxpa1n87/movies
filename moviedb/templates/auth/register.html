{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Register{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <fieldset>
      <label for="username">
        Username
        <input name="username" id="username" placeholder="Username" autocomplete="username" required
        {% for message in get_flashed_messages() %}
          {% if 'auth_register_invalid_username' in message or 'auth_register_username_already_registered' in message  %}
            aria-invalid="true"
            aria-describedby="invalid-helper"
          {% endif %}
        {% endfor %}
        ></input>
        {% for message in get_flashed_messages() %}
            {% if 'auth_register_invalid_username' in message %}
              <small id="invalid-helper">
                {{ message['auth_register_invalid_username'] }}
              </small>
            {% elif 'auth_register_username_already_registered' in message %}
              <small id="invalid-helper">
                {{ message['auth_register_username_already_registered'] }}
              </small>
            {% endif %}
        {% endfor %}
      </label>
      <label for="password">
        Password
        <input type="password" name="password" id="password" placeholder="Password" required></input>
      </label>
    </fieldset>
    <input type="submit" value="Register"></input>
  </form>
{% endblock %}
